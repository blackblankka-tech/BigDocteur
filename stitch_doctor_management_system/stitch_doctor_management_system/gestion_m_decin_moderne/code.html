<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background min-h-screen text-on-surface font-body-md antialiased flex flex-col">
<!-- Form Navigation Context (Not Global Nav) -->
<header class="w-full bg-surface border-b border-surface-variant flex items-center h-[64px] px-md md:px-lg sticky top-0 z-10">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors mr-sm">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Add New Doctor</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex justify-center py-lg md:py-xl px-md md:px-lg overflow-y-auto">
<!-- Form Card Container -->
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-[24px] shadow-sm border border-surface-variant overflow-hidden flex flex-col">
<div class="p-lg md:p-[32px] flex-grow">
<!-- Photo Upload Section -->
<div class="flex flex-col items-center mb-xl">
<div class="relative group cursor-pointer">
<!-- Placeholder Avatar -->
<div class="w-[120px] h-[120px] rounded-full border border-dashed border-outline-variant bg-surface-container-low flex flex-col items-center justify-center text-on-surface-variant group-hover:bg-surface-container transition-colors group-hover:border-primary overflow-hidden">
<span class="material-symbols-outlined text-[32px] mb-xs group-hover:text-primary transition-colors">add_a_photo</span>
<span class="font-label-md text-label-md group-hover:text-primary transition-colors">Upload</span>
<!-- Hidden actual file input -->
<input accept="image/*" aria-label="Upload doctor photo" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
</div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm text-center">Allowed formats: JPG, PNG. Max size: 2MB.</p>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-lg">
<!-- Standard Input: Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="doctorName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-[16px] pl-[44px] pr-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all placeholder:text-on-surface-variant/50 h-[48px]" id="doctorName" name="doctorName" placeholder="e.g., Dr. Jane Doe" type="text"/>
</div>
</div>
<!-- Input with Validation Error: Birth Date -->
<div>
<label class="block font-label-md text-label-md text-error mb-xs" for="birthDate">Date of Birth</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-error pointer-events-none">calendar_today</span>
<input aria-describedby="birthDate-error" aria-invalid="true" class="w-full bg-error-container/10 border border-error rounded-[16px] pl-[44px] pr-[44px] py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-error focus:border-error transition-all h-[48px]" id="birthDate" name="birthDate" type="date" value="2035-01-01"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-error pointer-events-none">error</span>
</div>
<p class="font-label-md text-label-md text-error mt-xs" id="birthDate-error">Date of birth cannot be in the future.</p>
</div>
<!-- Optional Additional Field for layout context -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="specialty">Primary Specialty (Optional)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">medical_services</span>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-[16px] pl-[44px] pr-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all appearance-none h-[48px]" id="specialty" name="specialty">
<option disabled="" selected="" value="">Select a specialty...</option>
<option value="cardiology">Cardiology</option>
<option value="pediatrics">Pediatrics</option>
<option value="neurology">Neurology</option>
<option value="general">General Practice</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="bg-surface-container border-t border-surface-variant px-lg py-md flex justify-end gap-sm md:gap-md items-center">
<button class="px-lg py-sm rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-variant transition-colors h-[40px]" type="button">
                    Cancel
                </button>
<button class="px-lg py-sm rounded-full bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm flex items-center gap-xs h-[40px]" type="submit">
<span class="material-symbols-outlined text-[18px]">save</span>
                    Save Doctor
                </button>
</div>
</div>
</main>
</body></html>
